name: Documentation

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]

jobs:
  lint:
    name: JSDoc

    runs-on: ubuntu-latest
    permissions: {}

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
    - run: npm ci --ignore-scripts
    - run: npm run docs
